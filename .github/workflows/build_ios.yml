name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. إعداد بيئة Ruby مستقرة لتعمل مع CocoaPods دون تعارض الإصدارات
      - name: Set up Ruby & CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install CocoaPods
        run: gem install cocoapods

      # 2. إعداد بيئة Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. إيقاف Swift Package Manager لمنع التعارض مع google_mobile_ads و webview
      - name: Disable Swift Package Manager & Fetch Packages
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      # 4. ضبط ملف Podfile وتأكيد منصة iOS 15.0 تلقائياً
      - name: Fix Podfile & Prepare CocoaPods
        run: |
          cd ios
          sed -i '' "s/# platform :ios, '.*'/platform :ios, '15.0'/g" Podfile || true
          if ! grep -q "platform :ios" Podfile; then
            echo "platform :ios, '15.0'" | cat - Podfile > temp && mv temp Podfile
          fi
          pod repo update || true
          cd ..

      # 5. بناء التطبيق بنجاح بصيغة Runner.app بدون توقيع شهادات
      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      # 6. ضغط مجلد التطبيق إلى صيغة IPA
      - name: Create IPA File
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r MiniGamesHub.ipa Payload

      # 7. رفع ملف الـ IPA في قسم الـ Artifacts ليكون جاهزاً للتحميل
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-ipa
          path: MiniGamesHub.ipa