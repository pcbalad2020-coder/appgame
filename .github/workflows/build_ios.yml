name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. تثبيت وحل مشاكل Ruby & CocoaPods
      - name: Set up Ruby & CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2' # استخدام إصدار ثابت ومستقر من Ruby لتفادي أخطاء Ruby 3.4

      - name: Install CocoaPods
        run: gem install cocoapods

      # 2. إعداد Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 3. إعداد Pods وتحديد المنصة لتفادي أخطاء CocoaPods
      - name: Setup Pods
        run: |
          cd ios
          pod repo update || true
          cd ..

      # 4. بناء التطبيق لـ iOS
      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      # 5. ضغط ملف الـ Runner وتجهيز الـ IPA
      - name: Create IPA File
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r MiniGamesHub.ipa Payload

      # 6. رفع ملف الـ IPA كـ Artifact
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-ipa
          path: MiniGamesHub.ipa